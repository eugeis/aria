# aria — example configuration.
# Copy to ~/.aria/config.toml and adjust. Every key has a built-in default;
# only what you need must be present.

[server]
# Bind address for the HTTP(S) listener.
bind = "0.0.0.0:8080"
# Public https URL that Amazon and Echo devices use (your domain behind Caddy,
# or aria's own TLS). Stream URLs are built from this.
public_base_url = "https://aria.example.com"
# Alexa skill client id (amzn1.ask.skill....). When set, requests from other
# skills are rejected.
client_id = "amzn1.ask.skill.00000000-0000-4000-8000-000000000000"
# Native TLS (optional; otherwise terminate TLS in front of aria, e.g. Caddy).
# tls_cert = "/etc/letsencrypt/live/aria.example.com/fullchain.pem"
# tls_key  = "/etc/letsencrypt/live/aria.example.com/privkey.pem"
# data_dir = "~/.aria"

[library]
# Folders scanned recursively for MP3/AAC (FLAC is indexed but not streamed
# in v0.1).
paths = ["/srv/music"]
# Rescan interval in seconds (0 disables).
rescan_secs = 3600

[zeroclaw]
# ZeroClaw gateway base URL (same box: ws://127.0.0.1:<gateway port>).
gateway = "ws://127.0.0.1:3000"
# Bearer token for the gateway; may come from $ARIA_ZC_TOKEN instead.
# token = "change-me"
# Agent alias in zeroclaw's config to talk to. Use a lightweight agent with a
# fast model for low voice latency.
agent_alias = "voice"
# Response budget for one voice turn (ms). Alexa needs an answer within ~8 s;
# on timeout the partial answer is spoken. Clamped to 1000..7900.
turn_timeout_ms = 7500
# Prepended to every utterance sent to the agent.
# voice_note = "You are talking to the user through an Alexa device..."
# Development: no gateway connection, echoes the utterance back.
mock = false

[radio]
# Preset stations; play "play rock fm" on the Echo.
[radio.stations]
"rock fm" = "https://example.com/rock.mp3"
"jazz lounge" = "https://example.com/jazz.aac"

[logging]
level = "info"
