# Manual deploy of the Aria app (brain + ASK sidecar) to li7.
#
#   Repo: eugeis/aria   (this repo)
#   What it does:
#     1. renders the brain through the pinned mosaic generator
#     2. builds + imports both images into k3s:
#          mosaic/aria:<sha>      (the rendered brain)
#          mosaic/aria-ask:<sha>  (the hand-written ASK surface)
#     3. injects ALL the li7-only glue into the rendered helm chart — the
#        aria-ask sidecar, the hostPath mounts (/media, /data, /vector),
#        the service ports, the ingress path split, the no-surge rollout
#        strategy. ONE helm upgrade is final: no
#        post-helm kubectl patch (a second template mutation spawns a
#        second ReplicaSet and deadlocks the rollout on this memory-tight
#        node — the pod and its replacement may never both be scheduled).
#     4. creates the namespace + secrets (values from files on the runner —
#        see deploy/li7/SECRETS.md)
#     5. helm upgrade --install (hostPaths on ext4 — LanceDB cannot commit
#        on exFAT)
#
# Prereqs on li7 (see deploy/li7/SECRETS.md):
#   /var/lib/aria-data      ext4 host dir (brain corpus + persist seam + sqlite)
#   /var/lib/aria-lancedb   ext4 host dir (the LanceDB vector store)
#   /home/ee/audio          the audio collections (musik / predigt / bible / books / ...)
#   the secret files under /home/ee/.ssh/ (aria-*)
#   a runner registered in THIS repo (label "li7") — the li7 machine already
#   runs one each for eugeis/mosaic, -bible and -mosaic-pages; register a
#   fourth for eugeis/aria (same machine; docker/k3s/helm are present)

name: deploy

on:
  workflow_dispatch:
    inputs:
      ref:
        description: The aria branch/SHA to deploy
        required: true
        default: main
      chat_base_url:
        description: Override the brain's LLM base URL (empty = OpenRouter, baked into the tessera model registry; the vLLM box is dev/data-prep only — SECRETS.md)
        required: false
        default: ""

concurrency:
  group: onprem-aria
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  KUBECONFIG: /home/ee/.kube/config
  # Keep in lockstep with .github/workflows/ci.yml (the pinned generator).
  MOSAIC_REV: 6ad1b49e8cd3e8d2ee95805bde18e67b8dc58aad
  NAMESPACE: aria
  RELEASE: aria
  HOST: aria.eisler-systems.de

jobs:
  deploy:
    runs-on: [self-hosted, li7]
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Resolve the image tag
        id: imagetag
        run: echo "tag=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Check out mosaic @ pinned rev
        uses: actions/checkout@v4
        with:
          repository: eugeis/mosaic
          ref: ${{ env.MOSAIC_REV }}
          path: .mosaic
          fetch-depth: 1
          token: ${{ secrets.MOSAIC_ONPREM_PAT }}

      - name: Activate the stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Verify the on-prem toolchain
        run: |
          set -euo pipefail
          cargo --version
          rustc --version
          docker --version
          helm version --short
          kubectl cluster-info
          command -v k3s

      - name: Build mosaic
        working-directory: .mosaic
        run: cargo build -p mosaic-cli --release

      - name: Render the aria app
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/aria-rendered"
          .mosaic/target/release/mosaic build . -o "$RUNNER_TEMP/aria-rendered"
          test -f "$RUNNER_TEMP/aria-rendered/deploy/li7/Dockerfile"
          test -f "$RUNNER_TEMP/aria-rendered/deploy/li7/helm/Chart.yaml"

      - name: Build and import the brain image into k3s
        env:
          IMAGE: "mosaic/aria:${{ steps.imagetag.outputs.tag }}"
        run: |
          set -euo pipefail
          # The generated Dockerfile ships a bare debian-slim; curl is needed
          # for the post-rollout in-pod smoke check (idempotent guard).
          grep -q "ca-certificates curl" "$RUNNER_TEMP/aria-rendered/deploy/li7/Dockerfile" \
            || sed -i 's/--no-install-recommends ca-certificates \\/--no-install-recommends ca-certificates curl \\/' \
               "$RUNNER_TEMP/aria-rendered/deploy/li7/Dockerfile"
          docker build \
            -f "$RUNNER_TEMP/aria-rendered/deploy/li7/Dockerfile" \
            -t "$IMAGE" \
            "$RUNNER_TEMP/aria-rendered"
          docker save "$IMAGE" | sudo k3s ctr images import -

      - name: Build and import the ASK sidecar image into k3s
        env:
          IMAGE: "mosaic/aria-ask:${{ steps.imagetag.outputs.tag }}"
        run: |
          set -euo pipefail
          docker build -f adapter/Dockerfile -t "$IMAGE" adapter/
          docker save "$IMAGE" | sudo k3s ctr images import -

      - name: Inject the li7 glue into the rendered chart
        run: |
          set -euo pipefail
          # Single-file, std-only Rust — no python in the production
          # tooling; `rustc -O` is the whole build.
          rustc -O deploy/li7/inject.rs -o "$RUNNER_TEMP/aria-inject"
          "$RUNNER_TEMP/aria-inject" \
            "$RUNNER_TEMP/aria-rendered/deploy/li7/helm" \
            "${{ steps.imagetag.outputs.tag }}"

      - name: Create the namespace + secrets
        run: |
          set -uo pipefail
          kubectl create namespace "$NAMESPACE" --dry-run=client -o yaml | kubectl apply -f -
          # One secret per declared env var: name = the env var lowercased,
          # dots/underscores to dashes; key = the env var. Values come from
          # files on the runner (see deploy/li7/SECRETS.md) — never from the
          # repo. A missing file warns (the surface fails soft), never fails
          # the deploy.
           # MOAIC_CHAT_API_KEY is the OpenRouter key (house policy: all
           # mosaic apps run operations on OpenRouter) — the SAME file the
           # pages app uses.
           declare -A FILES=(
             [MOAIC_JWT_SECRET]=/home/ee/.ssh/aria-jwt-secret
             [MOAIC_ADMIN_PASSWORD]=/home/ee/.ssh/aria-admin-password
             [MOAIC_ADAPTER_TOKEN]=/home/ee/.ssh/aria-adapter-token
             [MOAIC_CHAT_API_KEY]=/home/ee/.ssh/openrouter
             [MOAIC_MCP_BIBLE_AUTH]=/home/ee/.ssh/bible-reader-token
           )
          for VAR in "${!FILES[@]}"; do
            f="${FILES[$VAR]}"
            if [ -f "$f" ]; then
              VAL=$(tr -d '[:space:]' < "$f")
              name=$(printf '%s' "$VAR" | tr 'A-Z_' 'a-z-')
              kubectl -n "$NAMESPACE" create secret generic "$name" \
                --from-literal="$VAR=$VAL" --dry-run=client -o yaml \
                | kubectl apply -n "$NAMESPACE" -f -
            else
              echo "::warning::no $VAR at $f — the matching surface stays off"
            fi
          done

      - name: Apply the cert-manager Certificate
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/cert.yaml" <<CERT
          apiVersion: cert-manager.io/v1
          kind: Certificate
          metadata:
            name: ${HOST//./-}-tls
            namespace: $NAMESPACE
          spec:
            secretName: ${HOST//./-}-tls
            issuerRef:
              name: letsencrypt-prod
              kind: ClusterIssuer
            dnsNames:
              - $HOST
          CERT
          kubectl apply -f "$RUNNER_TEMP/cert.yaml"

      - name: Deploy the Helm chart
        env:
          CHART: "$RUNNER_TEMP/aria-rendered/deploy/li7/helm"
          IMAGE: "mosaic/aria:${{ steps.imagetag.outputs.tag }}"
          CHAT_BASE_URL: ${{ inputs.chat_base_url }}
        run: |
          set -euo pipefail
          chat_args=()
          if [ -n "$CHAT_BASE_URL" ]; then
            chat_args+=(--set "env.MOAIC_CHAT_BASE_URL=$CHAT_BASE_URL")
          fi
          # The chat base URL is OpenRouter (baked into the tessera model
          # registry; the key rides MOAIC_CHAT_API_KEY). The chat_base_url
          # input overrides it (e.g. for a future self-hosted model box —
          # SECRETS.md).
          helm upgrade --install "$RELEASE" "$CHART" \
            --namespace "$NAMESPACE" \
            --create-namespace \
            --set image.repository="${IMAGE%:*}" \
            --set image.tag="${IMAGE##*:}" \
            --set image.pullPolicy=Never \
            --set dataPvc.enabled=false \
            --set "env.MOAIC_DB_PATH=/data/app.db" \
            --set "env.MOSAIC_VECTOR_BACKEND=lancedb" \
            --set "env.MOSAIC_VECTOR_URL=/vector" \
            "${chat_args[@]}"
          # NOTE: no post-helm kubectl patch. The injector (step above)
          # baked the hostPath volumes/mounts into the chart template, so
          # this upgrade IS the final pod spec.

      - name: Wait for the rollout + status
        run: |
          set -euo pipefail
          kubectl -n "$NAMESPACE" rollout status "deployment/$RELEASE" --timeout=1800s
          kubectl -n "$NAMESPACE" get deployment,service,ingress
          kubectl -n "$NAMESPACE" get pods -l app.kubernetes.io/name=aria -o wide

      - name: "Smoke: the ASK surface answers"
        run: |
          set -uo pipefail
          # The skill endpoint must answer Amazon's test envelope with 200.
          code=$(kubectl -n "$NAMESPACE" exec "deploy/$RELEASE" -c aria-ask -- \
            curl -s -o /dev/null -w '%{http_code}' -X POST \
            -H 'Content-Type: application/json' \
            -d '{"version":"1.0","request":{"type":"LaunchRequest","requestId":"smoke"}}' \
            http://127.0.0.1:8090/alexa || true)
          echo "ask /alexa answered: ${code:-?}"
          [ "$code" = "200" ] || echo "::warning::/alexa did not answer 200"
          code=$(kubectl -n "$NAMESPACE" exec "deploy/$RELEASE" -c aria -- \
            curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/readyz || true)
          echo "brain /readyz answered: ${code:-?} (503 = still booting the corpus)"
