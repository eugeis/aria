name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
      - name: musl tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq musl-tools
      - run: cargo build --release --target x86_64-unknown-linux-musl
      - name: Package
        run: |
          VER=${GITHUB_REF_NAME#v}
          mkdir -p dist
          cp target/x86_64-unknown-linux-musl/release/aria dist/aria
          cp config/aria.example.toml dist/aria.example.toml
          cp deploy/aria.service dist/aria.service
          tar czf "aria-${VER}-x86_64-linux-musl.tar.gz" -C dist aria aria.example.toml aria.service
          sha256sum "aria-${VER}-x86_64-linux-musl.tar.gz" > "aria-${VER}-x86_64-linux-musl.tar.gz.sha256"
      - name: GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            aria-*-x86_64-linux-musl.tar.gz
            aria-*-x86_64-linux-musl.tar.gz.sha256
          generate_release_notes: true
