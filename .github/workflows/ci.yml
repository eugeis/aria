name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # Pin the mosaic generator the `brain` job renders with. Bump when the
  # emitted app surface changes and re-verify the render + e2e. This carries
  # the MCP-client env-bound bearer auth (`app.mcp.servers[].auth_env` —
  # needed to consume the bible app's protected /mcp) + the workflow agent
  # node's `system` prompt prop (the voice persona).
  MOSAIC_REV: 6ad1b49e8cd3e8d2ee95805bde18e67b8dc58aad

jobs:
  brain:
    # Render the brain through the pinned mosaic generator, build it, and run
    # the tessera's declared e2e scenarios (the media/sermons knowledge
    # surfaces + the ask/resolve-play workflows over the O10 cassette + the
    # ADR 0012 default-deny access model). Self-hosted (a private repo cannot
    # use GitHub-hosted runners) — the li7 runner, labeled `aria`.
    name: brain (render + build + e2e)
    runs-on: [self-hosted, li7, aria]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: checkout mosaic @ pinned rev
        uses: actions/checkout@v4
        with:
          repository: eugeis/mosaic
          ref: ${{ env.MOSAIC_REV }}
          path: .mosaic
          fetch-depth: 1
          # mosaic is private; GITHUB_TOKEN only covers this repo.
          token: ${{ secrets.MOSAIC_GITHUB_TOKEN }}
      - name: build mosaic
        working-directory: .mosaic
        run: cargo build -p mosaic-cli --release
      - name: validate the tessera plan
        run: .mosaic/target/release/mosaic check .
      - name: render the aria app
        run: .mosaic/target/release/mosaic build . -o "$RUNNER_TEMP/aria-out"
      # Build only the `aria` app package (not the `web` member — its leptos
      # subtree is a separate, network-dependent resolve).
      - name: build the generated app
        run: cd "$RUNNER_TEMP/aria-out" && cargo build -p aria
      - name: "e2e (the tessera's kind=test scenarios)"
        run: .mosaic/target/release/mosaic test . -o "$RUNNER_TEMP/aria-out"

  adapter:
    # The hand-written ASK surface: unit tests (the ASK protocol, the player
    # state machine, the streaming edge cases, the scanner + deterministic
    # gzip, the brain-bridge config).
    name: adapter (tests)
    runs-on: [self-hosted, li7, aria]
    defaults:
      run:
        working-directory: adapter
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: adapter
      - name: fmt
        run: cargo fmt --check
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: test
        run: cargo test --workspace
